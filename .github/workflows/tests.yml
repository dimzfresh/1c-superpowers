name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Тесты плагина
        run: python3 -m unittest discover -s tests -v
      - name: Бюджет контекста
        run: python3 scripts/context_budget.py
